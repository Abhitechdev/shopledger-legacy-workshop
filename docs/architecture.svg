<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger application architecture</title>
  <desc id="description">Architecture and numbered order-placement flow for the ShopLedger Node and Express app.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b78"/></marker>
    <style>
      .title{font:700 25px Arial,sans-serif;fill:#fff}.subtitle{font:14px Arial,sans-serif;fill:#dce8f1}.head{font:700 16px Arial,sans-serif;fill:#17324d}.file{font:700 13px Arial,sans-serif;fill:#17324d}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:12px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#9aabb8;stroke-width:1.4}.group{fill:#f8fafc;stroke:#c5d0d8;stroke-width:1.4}.accent{fill:#fff1f2;stroke:#d9466e;stroke-width:2}.flow{fill:#eef7ff;stroke:#4884b6;stroke-width:1.5}.line{stroke:#5d6b78;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#8a9aa7;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.num{font:700 12px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f4f7f9"/>
  <rect x="24" y="18" width="1152" height="62" rx="10" fill="#17324d"/>
  <text class="title" x="50" y="52">ShopLedger — Node/Express POS, Khata &amp; GST architecture</text>
  <text class="subtitle" x="50" y="72">Verified source map and order-placement flow</text>

  <!-- Browser -->
  <rect class="group" x="24" y="104" width="190" height="178" rx="10"/>
  <text class="head" x="43" y="132">Browser UI</text>
  <rect class="box" x="42" y="146" width="154" height="112" rx="6"/>
  <text class="file" x="55" y="170">public/</text>
  <text class="tiny" x="55" y="193">index.html</text>
  <text class="tiny" x="55" y="214">js/app.js</text>
  <text class="tiny" x="55" y="235">css/style.css</text>
  <text class="tiny" x="55" y="252">POS cart, preview, orders</text>

  <!-- Server -->
  <rect class="group" x="257" y="104" width="220" height="178" rx="10"/>
  <text class="head" x="278" y="132">HTTP application</text>
  <rect class="box" x="276" y="146" width="182" height="112" rx="6"/>
  <text class="file" x="292" y="171">server.js</text>
  <text class="tiny" x="292" y="194">Express + bodyParser</text>
  <text class="tiny" x="292" y="215">static public/</text>
  <text class="tiny" x="292" y="236">/api routers</text>
  <text class="tiny" x="292" y="253">GET /orders/:id/invoice</text>

  <!-- Configuration -->
  <rect class="group" x="520" y="104" width="188" height="178" rx="10"/>
  <text class="head" x="540" y="132">Configuration</text>
  <rect class="box" x="538" y="146" width="151" height="112" rx="6"/>
  <text class="file" x="554" y="171">config.js</text>
  <text class="tiny" x="554" y="194">port + shop</text>
  <text class="tiny" x="554" y="215">HSN GST slabs</text>
  <text class="tiny" x="554" y="236">coupons</text>
  <text class="tiny" x="554" y="253">inventory defaults</text>

  <!-- Data -->
  <rect class="group" x="751" y="104" width="188" height="178" rx="10"/>
  <text class="head" x="771" y="132">Persistence</text>
  <rect class="box" x="769" y="146" width="151" height="112" rx="6"/>
  <text class="file" x="785" y="171">data/db.json</text>
  <text class="tiny" x="785" y="194">products + stock</text>
  <text class="tiny" x="785" y="215">customers + Khata</text>
  <text class="tiny" x="785" y="236">orders + settlements</text>
  <text class="tiny" x="785" y="253">audit + next IDs</text>

  <!-- Invoice -->
  <rect class="accent" x="982" y="104" width="194" height="178" rx="10"/>
  <text class="head" x="1002" y="132">Ticket focus</text>
  <text class="file" x="1002" y="165">lib/invoice.js</text>
  <text class="tiny" x="1002" y="188">computeInvoiceFigures()</text>
  <text class="tiny" x="1002" y="209">render()</text>
  <text class="tiny" x="1002" y="240">Printable HTML invoice</text>

  <!-- Routers -->
  <rect class="group" x="24" y="314" width="332" height="245" rx="10"/>
  <text class="head" x="44" y="343">routes/ — mounted under /api</text>
  <rect class="box" x="43" y="359" width="140" height="75" rx="6"/>
  <text class="file" x="54" y="380">products.js</text><text class="tiny" x="54" y="401">GET /products</text><text class="tiny" x="54" y="419">GET /coupons</text>
  <rect class="flow" x="198" y="359" width="140" height="75" rx="6"/>
  <text class="file" x="209" y="380">orders.js</text><text class="tiny" x="209" y="401">POST /orders</text><text class="tiny" x="209" y="419">list, get, cancel</text>
  <rect class="box" x="43" y="453" width="140" height="80" rx="6"/>
  <text class="file" x="54" y="474">customers.js</text><text class="tiny" x="54" y="495">GET /customers</text><text class="tiny" x="54" y="514">POST /:id/settle</text>
  <rect class="box" x="198" y="453" width="140" height="80" rx="6"/>
  <text class="file" x="209" y="474">reports.js</text><text class="tiny" x="209" y="495">dashboard, GST recon</text><text class="tiny" x="209" y="514">pricing preview/export</text>

  <!-- Library -->
  <rect class="group" x="390" y="314" width="786" height="245" rx="10"/>
  <text class="head" x="410" y="343">lib/ — business and data modules</text>
  <g>
    <rect class="box" x="410" y="359" width="141" height="62" rx="6"/><text class="file" x="421" y="380">store.js</text><text class="tiny" x="421" y="402">read(), write(), audit</text>
    <rect class="box" x="563" y="359" width="141" height="62" rx="6"/><text class="file" x="574" y="380">inventory.js</text><text class="tiny" x="574" y="402">find(), check(), reserve()</text>
    <rect class="box" x="716" y="359" width="141" height="62" rx="6"/><text class="file" x="727" y="380">orders.js</text><text class="tiny" x="727" y="402">add(), get(), cancel()</text>
    <rect class="box" x="869" y="359" width="141" height="62" rx="6"/><text class="file" x="880" y="380">ledger.js</text><text class="tiny" x="880" y="402">findCustomer(), charge…</text>
    <rect class="box" x="1022" y="359" width="135" height="62" rx="6"/><text class="file" x="1033" y="380">coupons.js</text><text class="tiny" x="1033" y="402">validate(), calculate…</text>
    <rect class="box" x="410" y="442" width="141" height="62" rx="6"/><text class="file" x="421" y="463">pricing.js</text><text class="tiny" x="421" y="485">subtotal(), computeTotals()</text>
    <rect class="accent" x="563" y="442" width="141" height="62" rx="6"/><text class="file" x="574" y="463">tax.js</text><text class="tiny" x="574" y="485">getRateForItem(), split…</text>
    <rect class="accent" x="716" y="442" width="141" height="62" rx="6"/><text class="file" x="727" y="463">invoice.js</text><text class="tiny" x="727" y="485">computeInvoiceFigures()</text>
    <rect class="box" x="869" y="442" width="141" height="62" rx="6"/><text class="file" x="880" y="463">reports.js</text><text class="tiny" x="880" y="485">dashboard(), GST recon</text>
    <rect class="box" x="1022" y="442" width="135" height="62" rx="6"/><text class="file" x="1033" y="463">dates.js</text><text class="tiny" x="1033" y="485">today(), normalize…</text>
  </g>

  <!-- Flows -->
  <rect class="group" x="24" y="590" width="1152" height="185" rx="10"/>
  <text class="head" x="44" y="619">Numbered order-placement flow</text>
  <path class="line" d="M125 683 H248"/><path class="line" d="M362 683 H485"/><path class="line" d="M599 683 H722"/><path class="line" d="M836 683 H959"/>
  <g><circle cx="59" cy="652" r="12" fill="#2f75a8"/><text class="num" x="55" y="656">1</text><text class="file" x="79" y="655">public/js/app.js</text><text class="tiny" x="79" y="675">POST /api/orders</text></g>
  <g><circle cx="296" cy="652" r="12" fill="#2f75a8"/><text class="num" x="292" y="656">2</text><text class="file" x="316" y="655">routes/orders.js</text><text class="tiny" x="316" y="675">store.read(); inventory.find/check()</text></g>
  <g><circle cx="533" cy="652" r="12" fill="#2f75a8"/><text class="num" x="529" y="656">3</text><text class="file" x="553" y="655">pricing + coupon + tax</text><text class="tiny" x="553" y="675">subtotal → validate → computeTotals()</text></g>
  <g><circle cx="770" cy="652" r="12" fill="#2f75a8"/><text class="num" x="766" y="656">4</text><text class="file" x="790" y="655">ledger + inventory + orders</text><text class="tiny" x="790" y="675">charge Khata; reserve(); add()</text></g>
  <g><circle cx="1007" cy="652" r="12" fill="#2f75a8"/><text class="num" x="1003" y="656">5</text><text class="file" x="1027" y="655">store.appendAudit/write</text><text class="tiny" x="1027" y="675">updated db.json; 201 response</text></g>

  <path class="dash" d="M1032 282 V331 H786 V442"/>
  <text class="tiny" x="931" y="322">invoice route reads saved order</text>
  <rect x="45" y="739" width="17" height="17" rx="3" fill="#fff1f2" stroke="#d9466e" stroke-width="2"/>
  <text class="tiny" x="70" y="752">Ticket focus / tax dependency</text>
  <rect x="270" y="739" width="17" height="17" rx="3" fill="#eef7ff" stroke="#4884b6" stroke-width="1.5"/>
  <text class="tiny" x="295" y="752">Primary order route</text>
  <text class="tiny" x="1040" y="752">All labels verified from source</text>
</svg>
